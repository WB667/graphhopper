name: Mutation Testing
on: [push]

# Autorisations nécessaires pour lister les runs et télécharger les artefacts
permissions:
  actions: read
  contents: read

jobs:
  pitest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Étape 1 : build sans tests pour disposer des classes compilées
      - name: Pre-build class
        run: mvn -q -B -DskipTests -DskipITs -pl navigation,web-api -am install

      # Étape 2 : Exécution de PIT pour(navigation + web-api)
      - name: Run PIT (navigation + web-api)
        shell: bash
        run: |
          set -e
          
          # Crée un fichier neutre {argLine} pour éviter les erreurs de build
          : > "{argLine}"
          # Exécution du plugin PIT (analyse de mutations)
          mvn -q -B \
            -pl navigation,web-api -am \
            org.pitest:pitest-maven:1.20.3:mutationCoverage \
            -DfailWhenNoMutations=false \
            -DoutputFormats=HTML,CSV
           # Fonction : compte mutants tués / générés depuis le CSV
          count_from_csv() {
            local csv="$1"
            [[ -f "$csv" ]] || { echo "0 0"; return; }
            local total killed
            total=$(($(wc -l < "$csv")-1))
            (( total < 0 )) && total=0
            killed=$(grep -c ',KILLED,' "$csv" || true)
            echo "${killed:-0} ${total:-0}"
          }
          
          # Fonction : lit les mêmes valeurs depuis le HTML si CSV manquant
          count_from_html() {
            local html="$1"
            [[ -f "$html" ]] || { echo "0 0"; return; }
            awk '
              match($0,/Generated[[:space:]]+([0-9]+)[[:space:]]+mutations/,g){gen=g[1]}
              match($0,/Killed[[:space:]]+([0-9]+)/,k){det=k[1]}
              END{ if(det=="")det=0; if(gen=="")gen=0; print det,gen }
            ' "$html"
          }
          # Fonction : agrège les résultats d’un module (CSV ou HTML)
          aggregate_module() {
            local module="$1"
            local CSV=$(find "$module/target/pit-reports" -name mutations.csv 2>/dev/null | sort | tail -1)
            local HTML=$(find "$module/target/pit-reports" -name index.html    2>/dev/null | sort | tail -1)
            local d=0 g=0
            if [[ -n "$CSV" ]]; then
              read d g < <(count_from_csv "$CSV")
            elif [[ -n "$HTML" ]]; then
              read d g < <(count_from_html "$HTML")
            fi
            echo "$d $g"
          }
          # Agrégation : combine navigation + web-api
          read ND NG < <(aggregate_module navigation)
          read AD AG < <(aggregate_module web-api)

          DET=$((ND+AD))
          GEN=$((NG+AG))

          if [[ $DET -eq 0 && $GEN -eq 0 ]]; then
            echo 0 > score.txt
            exit 0
          fi

          [[ $GEN -eq 0 ]] && GEN=1 
          # Calcul du score final (en %)
          SCORE=$(awk -v d="$DET" -v g="$GEN" 'BEGIN{printf "%.2f",(d*100.0)/g}') 
          echo "Detected=$DET  Generated=$GEN  Score=${SCORE}%"
          echo "$SCORE" > score.txt

      # Étape 3 : Télécharge l'ancien score (si existant)
      - name: Download previous score
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: score
          workflow: mutation.yml       
          branch: ${{ github.ref_name }}
          search_artifacts: true
          if_no_artifact_found: ignore
          path: score                  

      # Étape 4 : Compare les scores
      - name: Fail if score decreased
        shell: bash
        run: |
          if [[ -f score/score.txt ]]; then
            PREV=$(cat score/score.txt)
            CURR=$(cat score.txt)
            echo "Previous=${PREV}%  Current=${CURR}%"
            awk -v p="$PREV" -v c="$CURR" 'BEGIN{ if (c+0 < p+0) exit 1 }' \
              && echo "Score stable ou en hausse." \
              || { echo "Score de mutation en baisse."; exit 1; }
          else
            echo "Aucun score précédent (première exécution)."
          fi

      # Étape 5 : Sauvegarde du score courant
      - name: Save current score
        uses: actions/upload-artifact@v4
        with:
          name: score
          path: score.txt