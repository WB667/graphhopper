name: Mutation Testing

on: [push]

jobs:
  pitest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Étape 1 : build sans tests pour disposer des classes compilées
      - name: Pre-build reactor
        run: mvn -q -B -DskipTests -DskipITs -pl navigation,web-api -am install

      # Étape 2 : Exécution de PIT en MODE CLI (aucun usage de surefire/argLine)
      - name: Run PIT (CLI) for navigation + web-api
        shell: bash
        env:
          MAVEN_OPTS: "-Xmx2G"
        run: |
          set -e

          # 1 Télécharger le CLI de PIT (ne change rien au repo)
          mvn -q org.apache.maven.plugins:maven-dependency-plugin:3.6.1:get \
            -Dartifact=org.pitest:pitest-command-line:1.20.3

          PIT_JAR="$HOME/.m2/repository/org/pitest/pitest-command-line/1.20.3/pitest-command-line-1.20.3.jar"

          # 2 Construire le classpath (dépendances + classes des 2 modules)
          mvn -q -pl navigation,web-api -am \
            -DincludeScope=test \
            -Dmdep.outputFile=deps.cp \
            org.apache.maven.plugins:maven-dependency-plugin:3.6.1:build-classpath

          CLASSPATH="$(cat deps.cp):navigation/target/classes:navigation/target/test-classes:web-api/target/classes:web-api/target/test-classes"

          # 3 Lancer le CLI PIT (bypass total de surefire => plus d'argLine)
          #    Ajuste les patterns si nécessaire (ici: tout com.graphhopper.*)
          mkdir -p target/pit-reports
          java -cp "$PIT_JAR" \
            org.pitest.mutationtest.commandline.MutationCoverageReport \
            --classPath "$CLASSPATH" \
            --reportDir "target/pit-reports" \
            --threads 2 \
            --targetClasses "com.graphhopper.*" \
            --targetTests   "com.graphhopper.*"

          # ---- AGRÉGATION MINIMALE navigation + web-api ----
          p() { [[ -f "$1" ]] || { echo "0 0"; return; }
            awk 'match($0,/Detected[^0-9]*([0-9]+)/,a){d=a[1]}
                 match($0,/Generated[^0-9]*([0-9]+)/,b){g=b[1]}
                 END{if(d=="")d=0; if(g=="")g=0; print d, g}' "$1"; }

          N=$(find navigation/target/pit-reports -name index.html 2>/dev/null | sort | tail -1)
          A=$(find web-api/target/pit-reports   -name index.html 2>/dev/null | sort | tail -1)

          read ND NG < <(p "$N")
          read AD AG < <(p "$A")

          DET=$((ND+AD))
          GEN=$((NG+AG))

          if [[ $DET -eq 0 && $GEN -eq 0 ]]; then
            echo 0 > score.txt
            exit 0
          fi

          [[ $GEN -eq 0 ]] && GEN=1
          SCORE=$(awk -v d="$DET" -v g="$GEN" 'BEGIN{printf "%.2f",(d*100.0)/g}')
          echo "Detected=$DET  Generated=$GEN  Score=${SCORE}%"
          echo "$SCORE" > score.txt

      # Étape 3 : Télécharge l'ancien score (si existant)
      - name: Download previous score
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: score
          workflow: .github/workflows/mutation.yml
          branch: ${{ github.ref_name }}
          search_artifacts: true
          if_no_artifact_found: ignore

      # Étape 4 : Compare les scores
      - name: Fail if score decreased
        shell: bash
        run: |
          if [[ -f score/score.txt ]]; then
            PREV=$(cat score/score.txt)
            CURR=$(cat score.txt)
            echo "Previous=${PREV}%  Current=${CURR}%"
            awk -v p="$PREV" -v c="$CURR" 'BEGIN{ if (c+0 < p+0) exit 1 }' \
              && echo "Score stable ou en hausse." \
              || { echo "Score de mutation en baisse."; exit 1; }
          else
            echo "Aucun score précédent (première exécution)."
          fi

      # Étape 5 : Sauvegarde du score courant
      - name: Save current score
        uses: actions/upload-artifact@v4
        with:
          name: score
          path: score.txt