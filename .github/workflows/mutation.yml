name: Mutation Testing
on: [push]

jobs:
  pitest:
    runs-on: ubuntu-latest
   
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pre-build reactor (install SNAPSHOTs)
        run: |
          mvn -q -B -DskipTests -DskipITs install

      - name: Run PIT (navigation + web-api)
        shell: bash
        env:
            MAVEN_OPTS: -DargLine= -DargLine= -Duser.dir=."
        run: |
          mvn -q -B \
            -DskipTests=false \
            -DargLine= -Dsurefire.argLine= -Dfailsafe.argLine= \
            -pl navigation,web-api -am \
            org.pitest:pitest-maven:1.20.3:mutationCoverage \
            -DfailWhenNoMutations=false

          # -------- localise le dernier index.html d'un module ----------
          get_idx () {
            local mod="$1"
            # cas 1 : sous-dossier(classique)
            local d1
            d1="$(ls -1dt "$mod/target/pit-reports"/*/ 2>/dev/null | head -1)"
            if [[ -n "$d1" && -f "$d1/index.html" ]]; then
              echo "$d1/index.html"; return 0
            fi
            # cas 2 : index directement dans pit-reports
            if [[ -f "$mod/target/pit-reports/index.html" ]]; then
              echo "$mod/target/pit-reports/index.html"; return 0
            fi
            # cas 3 : index dans un sous-dossier (ex: com.graphhopper.navigation)
            local p3
            p3="$(find "$mod/target/pit-reports" -maxdepth 2 -name index.html 2>/dev/null | head -1)"
            if [[ -n "$p3" ]]; then
              echo "$p3"; return 0
            fi
            return 1
          }

          # on lit uniquement le module navigation (tes tests y sont)
          IDX_NAV="$(get_idx navigation)" || { echo "Aucun rapport PIT trouvé pour 'navigation'"; echo "0" > score.txt; exit 0; }

          # extrait Detected / Generated du HTML
          read DET GEN < <(awk '
            match($0,/Detected[^0-9]*([0-9]+)/,a){d=a[1]}
            match($0,/Generated[^0-9]*([0-9]+)/,b){g=b[1]}
            END{ if(d=="") d=0; if(g=="") g=1; print d, g }
          ' "$IDX_NAV")

          SCORE=$(awk -v d="$DET" -v g="$GEN" 'BEGIN{printf "%.2f",(d*100.0)/g}')
          echo "Detected=$DET  Generated=$GEN  Score=${SCORE}%"
          echo "$SCORE" > score.txt

      - name: Download previous score
        uses: dawidd6/action-download-artifact@v6
        with:
          name: score
          
          workflow: .github/workflows/mutation.yml
          branch: ${{ github.ref_name }}
          search_artifacts: true
          if_no_artifact_found: ignore

      - name: Fail if score decreased
        shell: bash
        run: |
          if [[ -f score/score.txt ]]; then
            PREV=$(cat score/score.txt)
            CURR=$(cat score.txt)
            echo "Previous=${PREV}%  Current=${CURR}%"
            awk -v p="$PREV" -v c="$CURR" 'BEGIN{ if (c+0 < p+0) exit 1 }' && {
              echo "Score stable ou en hausse."
            } || {
              echo "Score de mutation en baisse."; exit 1;
            }
          else
            echo "Aucun score précédent (première exécution)."
          fi

      - name: Save current score
        uses: actions/upload-artifact@v4
        with:
          name: score
          path: score.txt