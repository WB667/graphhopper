name: Mutation Testing

on: [push]

jobs:
  pitest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Build sans tests, juste pour avoir les classes et dépendances
      - name: Pre-build reactor
        run: |
          mvn -q -B -DskipTests -DskipITs -pl navigation,web-api -am install

      # Lancer PIT (laisser le pom piloter l'argLine/jacoco/surefire)
      - name: Run PIT (navigation + web-api)
        shell: bash
        run: |
          set -e
          mvn -q -B -pl navigation,web-api -am \
            org.pitest:pitest-maven:1.20.3:mutationCoverage \
            -DfailWhenNoMutations=false

          # Récupère le dernier rapport du module "navigation"
          IDX_NAV="$(ls -1dt navigation/target/pit-reports/*/ 2>/dev/null | head -1)/index.html"
          if [[ ! -f "$IDX_NAV" ]]; then
            echo "Aucun rapport PIT trouvé pour 'navigation'"
            echo "0" > score.txt
            exit 0
          fi

          # Extrait Detected / Generated et calcule le score
          DET=$(grep -Eo "Detected[^0-9]*([0-9]+)"   "$IDX_NAV" | grep -Eo '[0-9]+' | head -1 || echo 0)
          GEN=$(grep -Eo "Generated[^0-9]*([0-9]+)"  "$IDX_NAV" | grep -Eo '[0-9]+' | head -1 || echo 1)
          awk -v d="$DET" -v g="$GEN" 'BEGIN{ if(g==0) g=1; printf "%.2f\n",(d*100.0)/g }' > score.txt
          echo "Detected=$DET  Generated=$GEN  Score=$(cat score.txt)%"

      # Essaie de récupérer l'ancien score (si indisponible : on n'échoue pas)
      - name: Download previous score
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: score
          workflow: .github/workflows/mutation.yml
          branch: ${{ github.ref_name }}
          search_artifacts: true
          if_no_artifact_found: ignore

      # Échoue si le score a baissé
      - name: Fail if score decreased
        shell: bash
        run: |
          if [[ -f score/score.txt ]]; then
            PREV=$(cat score/score.txt)
            CURR=$(cat score.txt)
            echo "Previous=${PREV}%  Current=${CURR}%"
            awk -v p="$PREV" -v c="$CURR" 'BEGIN{ if (c+0 < p+0) exit 1 }' \
              && echo "Score stable ou en hausse." \
              || { echo "Score de mutation en baisse."; exit 1; }
          else
            echo "Aucun score précédent (première exécution)."
          fi

      # Sauvegarde le score courant pour les prochains runs
      - name: Save current score
        uses: actions/upload-artifact@v4
        with:
          name: score
          path: score.txt