name: Mutation Testing

on: [push]

jobs:
  pitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --- PIT sur navigation + web-api, puis agrégation ---
      - name: Run PIT (navigation + web-api)
        shell: bash
        run: |
          set -e

          # --- navigation ---
          mvn -q -B -DskipTests \
            -pl navigation -am \
            org.pitest:pitest-maven:1.20.3:mutationCoverage \
            -DfailWhenNoMutations=false

          # --- web-api (peut ne produire aucun mutant, ne pas échouer) ---
          mvn -q -B -DskipTests \
            -pl web-api -am \
            org.pitest:pitest-maven:1.20.3:mutationCoverage \
            -DfailWhenNoMutations=false || true

          # --- parseur: extrait "Detected" et "Generated" d'un index.html ---
          parse() {
            local idx="$1"
            if [[ -f "$idx" ]]; then
              awk '
                match($0,/Detected[^0-9]*([0-9]+)/,a){d=a[1]}
                match($0,/Generated[^0-9]*([0-9]+)/,b){g=b[1]}
                END{ if(d=="") d=0; if(g=="") g=0; print d, g }
              ' "$idx"
            else
              echo "0 0"
            fi
          }

          # Index PIT de chaque module (le ** prend le sous-dossier de timestamp)
          read ND NG < <(parse navigation/target/pit-reports/**/index.html)
          read WD WG < <(parse web-api/target/pit-reports/**/index.html)

          # Somme globale (navigation + web-api)
          DET=$((ND + WD))
          GEN=$((NG + WG))

          # Evite division par zéro si aucun rapport valide
          [[ "$GEN" -eq 0 ]] && GEN=1

          SCORE=$(awk -v d="$DET" -v g="$GEN" 'BEGIN{ printf "%.2f", (d*100.0)/g }')
          echo "Detected=$DET  Generated=$GEN  Score=${SCORE}%"
          echo "$SCORE" > score.txt

      - name: Download previous score
        uses: dawidd6/action-download-artifact@v6
        with:
          name: score
          workflow: ${{ github.workflow }}
          if_no_artifact_found: ignore

      - name: Fail if score decreased
        shell: bash
        run: |
          if [[ -f score/score.txt ]]; then
            PREV=$(cat score/score.txt)
            CURR=$(cat score.txt)
            echo "Previous=${PREV}%  Current=${CURR}%"
            # Comparaison numérique fiable
            awk -v p="$PREV" -v c="$CURR" 'BEGIN{ exit (c+0 < p+0 ? 1 : 0) }' \
              && echo " Score stable ou en hausse" \
              || { echo "Score de mutation en baisse"; exit 1; }
          else
            echo "Pas de score précédent (première exécution)."
          fi

      - name: Save current score
        uses: actions/upload-artifact@v4
        with:
          name: score
          path: score.txt