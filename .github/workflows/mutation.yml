name: Mutation Testing
on: [push]

jobs:
  pitest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # build préalable (pas de tests) pour avoir les SNAPSHOTs
      - name: Pre-build reactor (install SNAPSHOTs)
        run: mvn -q -B -DskipTests -DskipITs -pl navigation,web-api -am install

      # === PIT sur navigation + web-api ===
      - name: Run PIT (navigation + web-api)
        shell: bash
        run: |
          set -e

          # Neutralise toutes les variantes d'argLine SANS MAVEN_OPTS
          mvn -q -B \
            -DskipTests=false \
            -DargLine=" " -Dsurefire.argLine=" " -Dfailsafe.argLine=" " \
            -pl navigation,web-api -am \
            org.pitest:pitest-maven:1.20.3:mutationCoverage \
            -DfailWhenNoMutations=false

          # --- récupère l'index du rapport PIT du module navigation
          IDX_NAV="$(find navigation/target/pit-reports -type f -name index.html -print -quit 2>/dev/null || true)"
          if [[ -z "$IDX_NAV" ]]; then
            echo "Aucun rapport PIT trouvé pour 'navigation'"
            echo "0" > score.txt
            exit 0
          fi

          # --- extrait Detected / Generated et calcule le score
          read DET GEN < <(awk '
            match($0,/Detected[^0-9]*([0-9]+)/,a){d=a[1]}
            match($0,/Generated[^0-9]*([0-9]+)/,b){g=b[1]}
            END{ if(d=="") d=0; if(g=="") g=1; print d, g }
          ' "$IDX_NAV")

          SCORE=$(awk -v d="$DET" -v g="$GEN" 'BEGIN{printf "%.2f",(d*100.0)/g}')
          echo "Detected=$DET  Generated=$GEN  Score=${SCORE}%"
          echo "$SCORE" > score.txt

      # charge le score précédent (s'il existe) depuis ce même workflow
      - name: Download previous score
        uses: dawidd6/action-download-artifact@v6
        with:
          name: score
          workflow: .github/workflows/mutation.yml
          branch: ${{ github.ref_name }}
          search_artifacts: true
          if_no_artifact_found: ignore

      # échoue si le score baisse
      - name: Fail if score decreased
        shell: bash
        run: |
          if [[ -f score/score.txt ]]; then
            PREV=$(cat score/score.txt)
            CURR=$(cat score.txt)
            echo "Previous=${PREV}%  Current=${CURR}%"
            awk -v p="$PREV" -v c="$CURR" 'BEGIN{ exit (c+0 < p+0) ? 1 : 0 }' \
              || { echo "Mutation score decreased"; exit 1; }
          else
            echo "No previous score (first run)."
          fi

      - name: Save current score
        uses: actions/upload-artifact@v4
        with:
          name: score
          path: score.txt