name: Mutation Testing

on: [push]

jobs:
  pitest:
    runs-on: ubuntu-latest
    steps:
      # Checkout du dépôt
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # installe les JARs SNAPSHOT dans le cache Maven local
      - name: Pre-build reactor (install SNAPSHOTs)
        run: |
          mvn -q -B -DskipTests -DskipITs install

      # Lancer PIT sur navigation + web-api
      - name: Run PIT (navigation + web-api)
        shell: bash
        run: |
          set -e

          echo "=== Running PIT on navigation + web-api ==="
          mvn -q -B -DskipTests \
            -pl navigation,web-api -am \
            org.pitest:pitest-maven:1.20.3:mutationCoverage \
            -DfailWhenNoMutations=false

          # Extraction des résultats
          DETECTED=$(grep -Eo "Detected[^0-9]*([0-9]+)" navigation/target/pit-reports/**/index.html | grep -Eo '[0-9]+' || echo 0)
          TOTAL=$(grep -Eo "Generated[^0-9]*([0-9]+)" navigation/target/pit-reports/**/index.html | grep -Eo '[0-9]+' || echo 1)

          SCORE=$(awk -v d="$DETECTED" -v t="$TOTAL" 'BEGIN{ if(t==0) t=1; printf "%.2f", (d*100.0)/t }')
          echo "Detected=$DETECTED  Total=$TOTAL  Score=${SCORE}%"
          echo "$SCORE" > score.txt

      # Télécharge l’ancien score pour comparaison
      - name: Download previous score
        uses: dawidd6/action-download-artifact@v6
        with:
          name: score
          workflow: ${{ github.workflow }}
          allow_forks: true              
          if_no_artifact_found: ignore

      # Compare avec le score précédent
      - name: Fail if score decreased
        shell: bash
        run: |
          if [[ -f score/score.txt ]]; then
            PREV=$(cat score/score.txt)
            CURR=$(cat score.txt)
            echo "Previous=${PREV}%  Current=${CURR}%"
            awk -v p="$PREV" -v c="$CURR" 'BEGIN{ if (c+0 < p+0) exit 1 }' && {
              echo "Score stable ou amélioré."
            } || {
              echo "Score de mutation en baisse."; exit 1;
            }
          else
            echo "Aucun score précédent (première exécution)."
          fi

      # Sauvegarde le nouveau score
      - name: Save current score
        uses: actions/upload-artifact@v4
        with:
          name: score
          path: score.txt