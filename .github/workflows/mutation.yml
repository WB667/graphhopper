name: Mutation Testing
on: [push]

jobs:
  pitest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Étape 1 : build propre sans tests
      - name: Pre-build reactor
        run: mvn -q -B -DskipTests -DskipITs install

      # Étape 2 : exécute PIT sur les modules navigation + web-api
      - name: Run PIT (navigation + web-api)
        shell: bash
        env:
          MAVEN_OPTS: -DargLine= -Dsurefire.argLine= -Dfailsafe.argLine=
        run: |
          mvn -q -B \
            -pl navigation,web-api -am \
            -DskipTests=false \
            org.pitest:pitest-maven:1.20.3:mutationCoverage \
            -DfailWhenNoMutations=false

          # Récupère le rapport de navigation
          IDX_NAV=$(find navigation/target/pit-reports -name index.html | head -1)
          if [[ -z "$IDX_NAV" ]]; then
            echo "Aucun rapport PIT trouvé pour navigation"
            echo "0" > score.txt
            exit 0
          fi

          DET=$(grep -Eo "Detected[^0-9]*([0-9]+)" "$IDX_NAV" | grep -Eo "[0-9]+" | head -1)
          GEN=$(grep -Eo "Generated[^0-9]*([0-9]+)" "$IDX_NAV" | grep -Eo "[0-9]+" | head -1)
          SCORE=$(awk -v d="$DET" -v g="$GEN" 'BEGIN{ if(g==0) g=1; printf "%.2f", (d*100.0)/g }')
          echo "Detected=$DET  Generated=$GEN  Score=${SCORE}%" | tee score.txt

      # Étape 3 : compare au score précédent
      - name: Download previous score
        uses: dawidd6/action-download-artifact@v6
        with:
          name: score
          workflow: .github/workflows/mutation.yml
          if_no_artifact_found: ignore

      - name: Fail if score decreased
        shell: bash
        run: |
          if [[ -f score/score.txt ]]; then
            PREV=$(cat score/score.txt)
            CURR=$(cat score.txt)
            echo "Previous=${PREV}%  Current=${CURR}%"
            awk -v p="$PREV" -v c="$CURR" 'BEGIN{ exit (c+0<p+0)?1:0 }' && echo "Score stable ou en hausse." || { echo "Score de mutation en baisse."; exit 1; }
          else
            echo "Aucun score précédent (première exécution)."
          fi

      # Étape 4 : sauvegarde du score actuel
      - name: Save current score
        uses: actions/upload-artifact@v4
        with:
          name: score
          path: score.txt