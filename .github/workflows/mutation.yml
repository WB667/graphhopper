name: Mutation Testing

on: [push]

permissions:
  actions: read
  contents: read

jobs:
  pitest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build (sans tests)
        run: mvn -q -B -DskipTests -DskipITs -pl navigation,web-api -am install

      - name: Run PIT
        shell: bash
        env:
          MAVEN_OPTS: "-Xmx2G"
        run: |
          set -e
          : > "{argLine}"

          mvn -q -B \
            -pl navigation,web-api -am \
            org.pitest:pitest-maven:1.20.3:mutationCoverage \
            -DfailWhenNoMutations=false \
            -DoutputFormats=HTML,CSV

          # ---- Extraction du score ----
          get_score() {
            local csv="$1"
            [[ -f "$csv" ]] || { echo "0"; return; }
            local total killed
            total=$(($(wc -l < "$csv")-1))
            killed=$(grep -c ',KILLED,' "$csv" || true)
            [[ $total -eq 0 ]] && echo "0" || awk -v k="$killed" -v t="$total" 'BEGIN{printf "%.2f",(k*100.0)/t}'
          }

          CSV=$(find navigation/target/pit-reports web-api/target/pit-reports -name mutations.csv | sort | tail -1)
          SCORE=$(get_score "$CSV")
          echo "$SCORE" > score.txt
          echo "Score actuel : ${SCORE}%"

      - name: Download previous score
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: score
          workflow: "Mutation Testing"
          branch: ${{ github.ref_name }}
          path: score
          if_no_artifact_found: ignore

      - name: Fail if score decreased
        shell: bash
        run: |
          if [[ -f score/score.txt ]]; then
            PREV=$(cat score/score.txt)
            CURR=$(cat score.txt)
            echo "Comparaison : Avant=${PREV}% → Après=${CURR}%"
            awk -v p="$PREV" -v c="$CURR" 'BEGIN{ if (c+0 < p+0) exit 1 }' \
              && echo " Score stable ou en hausse." \
              || { echo " Score de mutation en baisse."; exit 1; }
          else
            echo "Aucun score précédent (première exécution)."
          fi

      - name: Save current score
        uses: actions/upload-artifact@v4
        with:
          name: score
          path: score.txt